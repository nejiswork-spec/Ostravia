name: Website quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: node scripts/release-check.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Start production preview
        run: node scripts/serve.mjs > /tmp/ostravia-preview.log 2>&1 &
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-audit-reports
          path: artifacts/
